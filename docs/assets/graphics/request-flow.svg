<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Mando request flow</title>
  <desc id="desc">Request flow showing login, token issuance, authenticated request validation, authorization, service scoping, database work, and response envelopes.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334e68"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .auth{fill:#eff6ff;stroke:#2563eb;stroke-width:2}
      .scope{fill:#ecfdf5;stroke:#059669;stroke-width:2}
      .warn{fill:#fff7ed;stroke:#d97706;stroke-width:2}
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#102a43}
      .subtitle{font:400 16px Arial,Helvetica,sans-serif;fill:#486581}
      .step{font:700 16px Arial,Helvetica,sans-serif;fill:#102a43}
      .small{font:400 13px Arial,Helvetica,sans-serif;fill:#486581}
      .arrow{stroke:#334e68;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 8;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1280" height="520"/>
  <text class="title" x="58" y="62">Request Flow</text>
  <text class="subtitle" x="58" y="91">Actual flow reflected by `Program.cs`, middleware, controller attributes, workflow services, and response filters.</text>

  <rect class="auth" x="60" y="145" width="160" height="110" rx="8"/>
  <text class="step" x="86" y="178">1. Login</text>
  <text class="small" x="86" y="204">Public route</text>
  <text class="small" x="86" y="226">Fixed-window limit</text>

  <rect class="auth" x="270" y="145" width="170" height="110" rx="8"/>
  <text class="step" x="296" y="178">2. Token Pair</text>
  <text class="small" x="296" y="204">JWT access token</text>
  <text class="small" x="296" y="226">Hashed refresh token</text>

  <rect class="card" x="490" y="145" width="170" height="110" rx="8"/>
  <text class="step" x="516" y="178">3. Request</text>
  <text class="small" x="516" y="204">Bearer token</text>
  <text class="small" x="516" y="226">Correlation ID</text>

  <rect class="warn" x="710" y="145" width="190" height="110" rx="8"/>
  <text class="step" x="736" y="178">4. Validation</text>
  <text class="small" x="736" y="204">Issuer, audience, key</text>
  <text class="small" x="736" y="226">Lifetime, stamp, roles</text>

  <rect class="scope" x="950" y="145" width="210" height="110" rx="8"/>
  <text class="step" x="976" y="178">5. Authorization</text>
  <text class="small" x="976" y="204">Fallback auth policy</text>
  <text class="small" x="976" y="226">Role route attributes</text>

  <path class="arrow" d="M220 200 H255"/>
  <path class="arrow" d="M440 200 H475"/>
  <path class="arrow" d="M660 200 H695"/>
  <path class="arrow" d="M900 200 H935"/>

  <rect class="card" x="160" y="330" width="210" height="110" rx="8"/>
  <text class="step" x="186" y="363">6. Controllers</text>
  <text class="small" x="186" y="389">Map request DTOs</text>
  <text class="small" x="186" y="411">Translate statuses</text>

  <rect class="scope" x="430" y="330" width="230" height="110" rx="8"/>
  <text class="step" x="456" y="363">7. Services</text>
  <text class="small" x="456" y="389">Scope checks</text>
  <text class="small" x="456" y="411">Workflow guards</text>

  <rect class="warn" x="720" y="330" width="220" height="110" rx="8"/>
  <text class="step" x="746" y="363">8. EF Core</text>
  <text class="small" x="746" y="389">Transactions and locks</text>
  <text class="small" x="746" y="411">Row-version checks</text>

  <rect class="card" x="1000" y="330" width="190" height="110" rx="8"/>
  <text class="step" x="1026" y="363">9. Response</text>
  <text class="small" x="1026" y="389">Envelope filter</text>
  <text class="small" x="1026" y="411">Traceable errors</text>

  <path class="dash" d="M1055 255 V300 H265 V330"/>
  <path class="arrow" d="M370 385 H415"/>
  <path class="arrow" d="M660 385 H705"/>
  <path class="arrow" d="M940 385 H985"/>
</svg>
